name: sufrix_pos
description: Sufrix POS — Teller App (v2 Riverpod)
publish_to: none
version: 2.0.1+2

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sufrix_api:
    path: packages/sufrix_api
  flutter_localizations:
    sdk: flutter
  dio: ^5.4.3
  flutter_riverpod: ^2.6.1
  go_router: ^14.2.7
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  sqflite_common_ffi_web: ^0.4.5+1
  path: ^1.9.0
  path_provider: ^2.1.4
  lottie: ^3.3.2
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  timezone: ^0.9.4
  uuid: ^4.5.3
  connectivity_plus: ^7.0.0
  starxpand_sdk_wrapper: ^1.0.2
  pdf: ^3.11.1
  printing: ^5.14.2
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  flutter_svg: ^2.0.10+1
  flutter_secure_storage: ^10.3.1
  crypto: ^3.0.7
  flutter_local_notifications: ^17.2.3
  url_launcher: ^6.3.0
  wakelock_plus: ^1.2.0
  just_audio: ^0.10.5
  just_audio_windows: ^0.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.0
  mocktail: ^1.0.5

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/Icon.png"
  adaptive_icon_background: "#0a2540"
  adaptive_icon_foreground: "assets/IconForeground.png"
  adaptive_icon_monochrome: "assets/IconMonochrome.png"

flutter_native_splash:
  color: "#F4F6F8"
  image: "assets/Logo.png"
  android: true
  ios: true
  web: false
  android_gravity: center
  ios_content_mode: center
  fullscreen: false
  android_12:
    image: "assets/Icon.png"
    color: "#F4F6F8"

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
  assets:
    - assets/Icon.png
    - assets/IconForeground.png
    - assets/Icon.svg
    - assets/Logo.svg
    - assets/lottie/
    - assets/sounds/
