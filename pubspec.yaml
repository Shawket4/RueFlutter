name: sufrix_pos
description: Sufrix POS — Teller App (v2 Riverpod)
publish_to: none
version: 2.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.3
  flutter_riverpod: ^2.6.1
  go_router: ^14.2.7
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  lottie: ^3.3.2
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  uuid: ^4.5.3
  connectivity_plus: ^7.0.0
  starxpand_sdk_wrapper: ^1.0.2
  pdf: ^3.11.1
  printing: ^5.14.2
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/Icon.png"
  adaptive_icon_background: "#0a2540"
  adaptive_icon_foreground: "assets/IconForeground.png"
  adaptive_icon_monochrome: "assets/IconMonochrome.png"

flutter_native_splash:
  color: "#F4F6F8"
  image: "assets/Logo.png"
  android: true
  ios: true
  web: false
  android_gravity: center
  ios_content_mode: scaleAspectFit
  fullscreen: false
  android_12:
    image: "assets/IconForeground.png"
    color: "#F4F6F8"

flutter:
  uses-material-design: true
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 700
  assets:
    - assets/Icon.png
    - assets/IconForeground.png
    - assets/Icon.svg
    - assets/Logo.svg
    - assets/lottie/
